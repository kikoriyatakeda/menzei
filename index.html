<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>免税軽油 稼働・給油入力</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 10px; font-family: sans-serif; }
    .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
    .card-header { font-weight: bold; font-size: 1.1rem; }
    .table th { background-color: #e9ecef; position: sticky; top: 0; z-index: 1;}
    .weekend-sat { background-color: #f0f8ff !important; }
    .weekend-sun { background-color: #fff0f0 !important; }
    .table-wrapper { max-height: 55vh; overflow-y: auto; border-bottom: 1px solid #dee2e6;}
    .work-checkbox { transform: scale(1.8); cursor: pointer; margin-top: 5px; }

    /* ★給油量・アワメータが入力された時のデザイン（エメラルド基調） */
    .entered-row > td {
      background-color: #ecfdf5 !important;
      transition: background-color 0.2s ease;
    }
    .entered-input {
      color: #059669 !important; /* 文字をエメラルド色に */
      font-weight: bold !important; /* 文字を太字に */
      background-color: #ecfdf5 !important;
    }
  </style>
</head>
<body>
  <div class="container-fluid max-w-4xl mx-auto" style="max-width: 900px;">
    
    <!-- 上部：条件選択エリア -->
    <div class="card mb-3">
      <div class="card-header bg-success text-white">
        免税軽油 一ヶ月分まとめ入力
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4 col-sm-12">
            <label class="form-label text-muted small mb-1">対象年月</label>
            <!-- ★変更：月が変更されたら handleConditionChange を呼ぶ -->
            <input type="month" id="targetMonth" class="form-control" onchange="handleConditionChange()">
          </div>
          <div class="col-md-4 col-sm-12">
            <label class="form-label text-muted small mb-1">使用重機</label>
            <!-- ★変更：重機が選択・変更されたら handleConditionChange を呼ぶ -->
            <select id="machineSelect" class="form-select" onchange="handleConditionChange()">
              <option value="">読込中...</option>
            </select>
          </div>
          <div class="col-md-4 col-sm-12">
            <label class="form-label text-muted small mb-1">機械の使用地 (現場)</label>
            <select id="siteSelect" class="form-select">
              <option value="">読込中...</option>
            </select>
          </div>
        </div>

        <!-- 入力済み重機のメモ書きエリア -->
        <div class="row g-3 mt-1">
          <div class="col-12">
            <div class="alert alert-info py-2 mb-0 small" role="alert">
              <strong class="me-2 text-primary">【<span id="displayMonth"></span> の重機入力状況】</strong>
              <span id="submittedList">読込中...</span>
            </div>
          </div>
        </div>

        <hr class="text-muted mt-3 mb-3">
        <div class="row g-3">
          <div class="col-md-6 col-sm-12">
            <label class="form-label text-muted small mb-1">月初アワメータ</label>
            <!-- ★追加：oninputイベントを追加し、色を変える処理を呼び出す -->
            <input type="number" id="startMeter" class="form-control" placeholder="例: 4548.9" step="0.1" oninput="handleMeterInput(this)">
          </div>
          <div class="col-md-6 col-sm-12">
            <label class="form-label text-muted small mb-1">月末アワメータ</label>
            <!-- ★追加：oninputイベントを追加し、色を変える処理を呼び出す -->
            <input type="number" id="endMeter" class="form-control" placeholder="例: 4597.4" step="0.1" oninput="handleMeterInput(this)">
          </div>
        </div>
      </div>
    </div>

    <!-- 下部：カレンダー入力エリア -->
    <div class="card">
      <div class="card-body p-0 table-wrapper">
        <table class="table table-bordered table-hover mb-0 text-center align-middle">
          <thead>
            <tr>
              <th style="width: 15%">日</th>
              <th style="width: 15%">曜日</th>
              <th style="width: 25%">稼働(〇)</th>
              <th style="width: 45%">給油量 (L)</th>
            </tr>
          </thead>
          <tbody id="calendarBody">
            <tr><td colspan="4" class="text-muted py-5">上部で「対象年月」を選択するとカレンダーが表示されます</td></tr>
          </tbody>
        </table>
      </div>
      
      <!-- 保存ボタンエリア -->
      <div class="card-footer bg-white text-end py-3">
        <div id="statusMessage" class="d-inline-block me-3 text-danger fw-bold small"></div>
        <button class="btn btn-primary px-5 fw-bold" id="saveBtn" onclick="saveData()">一括保存する</button>
      </div>
    </div>
  </div>

  <script>
    let machineList = []; 

    window.onload = function() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(initDropdowns)
          .getInitialData();
      } else {
        const dummyData = {
          machines: [
            { id: 'M-001', name: 'グラップル①' },
            { id: 'M-002', name: 'ハーベスタ' },
            { id: 'M-003', name: 'スイングヤーダ' },
            { id: 'M-004', name: 'フォワーダ②' }
          ],
          sites: ['大ヌタ', '小ヌタ', '西の谷', '奥山']
        };
        initDropdowns(dummyData);
      }
    };

    function initDropdowns(data) {
      machineList = data.machines;
      
      const mSelect = document.getElementById('machineSelect');
      mSelect.innerHTML = '<option value="">▼ 重機を選択</option>';
      data.machines.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.text = m.name;
        mSelect.appendChild(opt);
      });

      const sSelect = document.getElementById('siteSelect');
      sSelect.innerHTML = '<option value="">▼ 現場を選択</option>';
      data.sites.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.text = s;
        sSelect.appendChild(opt);
      });
      
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      document.getElementById('targetMonth').value = `${yyyy}-${mm}`;
      
      // ★変更：初期表示時に条件変更関数を呼ぶ
      handleConditionChange();
    }

    // ★変更：月、または重機が変更された時に呼ばれる関数（既存データ取得機能を追加）
    function handleConditionChange() {
      generateCalendar();
      fetchSubmittedMachines(); 
      
      const targetMonth = document.getElementById('targetMonth').value;
      const machineId = document.getElementById('machineSelect').value;
      
      // アワメータの入力を一旦リセット
      const startInput = document.getElementById('startMeter');
      const endInput = document.getElementById('endMeter');
      startInput.value = '';
      endInput.value = '';
      handleMeterInput(startInput);
      handleMeterInput(endInput);
      document.getElementById('siteSelect').value = '';
      
      // 対象月と重機の両方が選択されていれば、既存データを取得しにいく
      if (targetMonth && machineId) {
        document.getElementById('calendarBody').style.opacity = '0.5'; // 取得中の視覚効果
        
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(applyExistingData)
            .getExistingData(targetMonth, machineId);
        } else {
          // プレビュー用のモック動作（M-001が選択されたらダミーデータをセット）
          setTimeout(() => {
            if (machineId === 'M-001') {
              applyExistingData({
                startMeter: '1234.5',
                endMeter: '1250.0',
                site: '大ヌタ',
                records: [
                  { date: targetMonth + '-05', isWorking: true, fuelAmount: '50' },
                  { date: targetMonth + '-06', isWorking: true, fuelAmount: '' }
                ]
              });
            } else {
              applyExistingData(null); // データなし
            }
          }, 500);
        }
      }
    }

    // ★追加：GASから受け取った既存データを画面にセットする関数
    function applyExistingData(data) {
      document.getElementById('calendarBody').style.opacity = '1';
      if (!data) return; // 既存データがなければそのまま（白紙）
      
      // アワメータのセット
      if (data.startMeter !== '') {
        const startInput = document.getElementById('startMeter');
        startInput.value = data.startMeter;
        handleMeterInput(startInput); // 色をつける
      }
      if (data.endMeter !== '') {
        const endInput = document.getElementById('endMeter');
        endInput.value = data.endMeter;
        handleMeterInput(endInput); // 色をつける
      }
      
      // 現場のセット
      if (data.site) {
        document.getElementById('siteSelect').value = data.site;
      }
      
      // カレンダー（稼働・給油）のセット
      if (data.records && data.records.length > 0) {
        const rows = document.getElementById('calendarBody').querySelectorAll('tr');
        rows.forEach(row => {
          const date = row.dataset.date;
          if (!date) return;
          
          // その日のデータがあるか探す
          const record = data.records.find(r => r.date === date);
          if (record) {
            const checkbox = row.querySelector('.work-checkbox');
            const fuelInput = row.querySelector('.fuel-input');
            
            checkbox.checked = record.isWorking;
            if (record.fuelAmount !== '') {
              fuelInput.value = record.fuelAmount;
              handleFuelInput(fuelInput); // 色をつける
            }
          }
        });
      }
    }

    function fetchSubmittedMachines() {
      const targetMonth = document.getElementById('targetMonth').value;
      if (!targetMonth) return;
      
      const [year, month] = targetMonth.split('-');
      document.getElementById('displayMonth').textContent = `${year}年${parseInt(month)}月`;
      document.getElementById('submittedList').textContent = '読込中...';

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(updateSubmittedListUI)
          .getSubmittedMachines(targetMonth);
      } else {
        setTimeout(() => {
          updateSubmittedListUI(['M-001', 'M-003']);
        }, 500);
      }
    }

    function updateSubmittedListUI(submittedIds) {
      const listEl = document.getElementById('submittedList');
      const submitted = submittedIds || [];

      if (!machineList || machineList.length === 0) {
        listEl.innerHTML = '<span class="text-muted">重機マスタを読み込み中です...</span>';
        return;
      }

      const badges = machineList.map(machine => {
        const isSubmitted = submitted.includes(machine.id);
        if (isSubmitted) {
          return `<span class="badge me-1 mb-1" style="font-size:0.85rem; background-color: #059669; color: white;">✓ ${machine.name}</span>`;
        } else {
          return `<span class="badge bg-secondary me-1 mb-1" style="font-size:0.85rem; opacity: 0.4;">${machine.name}</span>`;
        }
      });
      listEl.innerHTML = badges.join('');
    }

    function generateCalendar() {
      const monthVal = document.getElementById('targetMonth').value;
      const tbody = document.getElementById('calendarBody');
      tbody.innerHTML = ''; 

      if (!monthVal) return;

      const [year, month] = monthVal.split('-');
      const daysInMonth = new Date(year, month, 0).getDate(); 
      const weekDays = ['日', '月', '火', '水', '木', '金', '土'];

      for (let i = 1; i <= daysInMonth; i++) {
        const date = new Date(year, month - 1, i);
        const dayOfWeek = date.getDay();
        const dateStr = `${year}-${month}-${String(i).padStart(2, '0')}`;
        
        const tr = document.createElement('tr');
        if (dayOfWeek === 0) tr.className = 'weekend-sun text-danger';
        if (dayOfWeek === 6) tr.className = 'weekend-sat text-primary';

        tr.innerHTML = `
          <td class="fw-bold">${i}</td>
          <td>${weekDays[dayOfWeek]}</td>
          <td>
            <div class="form-check d-flex justify-content-center m-0">
              <input class="form-check-input work-checkbox" type="checkbox" onchange="focusFuelInput(this)">
            </div>
          </td>
          <td>
            <input type="number" class="form-control text-center fuel-input" placeholder="例: 90" step="0.1" min="0" oninput="handleFuelInput(this)">
          </td>
        `;
        tr.dataset.date = dateStr;
        tbody.appendChild(tr);
      }
    }

    function focusFuelInput(checkbox) {
      if (checkbox.checked) {
        const tr = checkbox.closest('tr');
        if (tr) {
          const fuelInput = tr.querySelector('.fuel-input');
          if (fuelInput) {
            fuelInput.focus();
          }
        }
      }
    }

    function handleFuelInput(input) {
      const tr = input.closest('tr');
      if (input.value !== '') {
        input.classList.add('entered-input'); 
        tr.classList.add('entered-row');      
      } else {
        input.classList.remove('entered-input');
        tr.classList.remove('entered-row');
      }
    }

    // ★追加：アワメータ入力時に文字色を変える関数
    function handleMeterInput(input) {
      if (input.value !== '') {
        input.classList.add('entered-input'); 
      } else {
        input.classList.remove('entered-input');
      }
    }

    function saveData() {
      const targetMonth = document.getElementById('targetMonth').value;
      const machineId = document.getElementById('machineSelect').value;
      const site = document.getElementById('siteSelect').value;
      const startMeter = document.getElementById('startMeter').value;
      const endMeter = document.getElementById('endMeter').value;
      const statusMsg = document.getElementById('statusMessage');
      const btn = document.getElementById('saveBtn');

      statusMsg.textContent = ''; 

      if (!targetMonth || !machineId || !site) {
        statusMsg.textContent = '対象年月、重機、現場をすべて選択してください。';
        return;
      }

      const machineName = machineList.find(m => m.id === machineId).name;
      const records = [];
      const rows = document.getElementById('calendarBody').querySelectorAll('tr');

      rows.forEach(row => {
        const isWorking = row.querySelector('.work-checkbox').checked;
        const fuelAmount = row.querySelector('.fuel-input').value;
        const date = row.dataset.date;

        if (isWorking || fuelAmount) {
          records.push({
            date: date,
            machineId: machineId,
            machineName: machineName,
            site: site,
            isWorking: isWorking,
            fuelAmount: fuelAmount
          });
        }
      });

      if (records.length === 0 && !startMeter && !endMeter) {
        statusMsg.textContent = '保存するデータ（アワメータ、稼働、給油量のいずれか）がありません。';
        return;
      }

      const payload = {
        hourMeter: {
          targetMonth: targetMonth,
          machineId: machineId,
          machineName: machineName,
          startMeter: startMeter,
          endMeter: endMeter
        },
        records: records
      };

      btn.disabled = true;
      btn.textContent = '保存中...';

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(response) {
            btn.disabled = false;
            btn.textContent = '一括保存する';
            if (response.success) {
              alert(response.message);
              document.getElementById('machineSelect').value = '';
              document.getElementById('startMeter').value = '';
              document.getElementById('endMeter').value = '';
              
              fetchSubmittedMachines(); 
              generateCalendar();
            } else {
              alert(response.message);
            }
          })
          .withFailureHandler(function(error) {
            btn.disabled = false;
            btn.textContent = '一括保存する';
            alert('通信エラーが発生しました: ' + error.message);
          })
          .saveData(payload);
      } else {
        setTimeout(function() {
          btn.disabled = false;
          btn.textContent = '一括保存する';
          let mockMsg = '【プレビュー画面】\n以下のデータを保存しました:\n（既存データがある場合は上書きされました）\n';
          if(startMeter || endMeter) mockMsg += '・アワメータ\n';
          if(records.length > 0) mockMsg += '・稼働記録 ' + records.length + '件';
          
          alert(mockMsg);
          // 保存後に重機選択とアワメータをリセット
          document.getElementById('machineSelect').value = '';
          document.getElementById('startMeter').value = '';
          document.getElementById('endMeter').value = '';
          handleMeterInput(document.getElementById('startMeter'));
          handleMeterInput(document.getElementById('endMeter'));
          fetchSubmittedMachines();
          generateCalendar();
        }, 1000);
      }
    }
  </script>
</body>
</html>
